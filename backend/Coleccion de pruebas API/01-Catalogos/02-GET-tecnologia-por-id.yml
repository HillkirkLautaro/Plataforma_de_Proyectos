http:
  method: GET
  url: "{{baseUrl}}/api/catalogo/tecnologias/{{techId}}"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Devuelve 200 OK con la tecnología solicitada", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(Number(body.id)).to.equal(Number(bru.getVar("techId")));
        });

