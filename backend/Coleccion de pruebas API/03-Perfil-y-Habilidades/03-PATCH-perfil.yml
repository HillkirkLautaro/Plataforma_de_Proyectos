info:
  name: PATCH /portfolio/perfil (parcial)
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/portfolio/perfil"
  body:
    type: json
    data: |-
      {
        "bio": "Bio actualizada parcialmente con PATCH."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Actualiza solo la bio con PATCH -> 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().perfil.bio).to.equal("Bio actualizada parcialmente con PATCH.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
