info:
  name: POST /portfolio/perfil/habilidades (tecnología)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/portfolio/perfil/habilidades"
  body:
    type: json
    data: |-
      {
        "tipo": "tecnologia",
        "id": {{techId}},
        "nivel": "intermedio"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Agrega tecnología al perfil -> 201 Created", function () {
          expect(res.getStatus()).to.equal(201);
          const body = res.getBody();
          expect(body.habilidad.tipo).to.equal("tecnologia");
          expect(body.habilidad.nivel).to.equal("intermedio");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
