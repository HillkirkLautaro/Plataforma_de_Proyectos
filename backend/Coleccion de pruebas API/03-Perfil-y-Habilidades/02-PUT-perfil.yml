info:
  name: PUT /portfolio/perfil (reemplazo completo)
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/portfolio/perfil"
  body:
    type: json
    data: |-
      {
        "nombre_completo": "Usuario Bruno Editado",
        "bio": "Desarrollador fullstack de pruebas automáticas."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Actualiza el perfil completo con 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body.perfil.nombre_completo).to.equal("Usuario Bruno Editado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
