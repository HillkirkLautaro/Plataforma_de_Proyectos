<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DevPortfolio</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <span class="auth-brand">DevPortfolio</span>
            <h2>Bienvenido</h2>
            <p class="subtitle">Ingresa tus credenciales para administrar tu portafolio</p>
            <form id="form-login">
                <div class="form-field">
                    <label for="identificador">Usuario o correo electrónico</label>
                    <input type="text" id="identificador" placeholder="tu_usuario o correo@ejemplo.com" required>
                </div>
                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" minlength="12" maxlength="72" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit">Ingresar al sistema</button>
                <p id="auth-message" class="auth-status" role="status" aria-live="polite"></p>
            </form>
            <div class="auth-footer">
                <div class="footer-links">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </div>
                <a href="../index.html" class="footer-links">← Volver al menú principal</a>
            </div>
        </div>
    </div>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
