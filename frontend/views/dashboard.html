<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi panel | DevPortfolio</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <header class="navbar">
        <h1>DevPortfolio / Panel</h1>
        <nav><a href="/">Portafolio público</a><button id="logout" type="button">Cerrar sesión</button></nav>
    </header>
    <main class="dashboard container">
        <section class="welcome"><p class="eyebrow">ÁREA PRIVADA</p><h2>Hola, <span id="developer-name">Desarrollador</span></h2><p>Gestioná los proyectos de tu portfolio.</p></section>
        <section class="panel-card">
            <h2>Nuevo proyecto</h2>
            <form id="project-form">
                <label>Nombre<input name="nombre" maxlength="120" required></label>
                <label>Descripción<textarea name="descripcion" rows="3"></textarea></label>
                <label>Etapa<select name="etapa"><option>formulación</option><option>modelado</option><option>implementación</option><option>testing</option><option>producción</option><option>mantenimiento</option></select></label>
                <div class="date-fields"><label>Inicio<input type="date" name="fecha_inicio"></label><label>Fin<input type="date" name="fecha_fin"></label><label>Deadline<input type="date" name="deadline"></label></div>
                <label>Tecnologías
                    <select name="tecnologias" id="tecnologias" multiple size="5" aria-describedby="catalog-help"></select>
                </label>
                <label>Lenguajes
                    <select name="lenguajes" id="lenguajes" multiple size="5" aria-describedby="catalog-help"></select>
                </label>
                <small id="catalog-help">Podés seleccionar varias opciones con Ctrl (Windows/Linux) o Cmd (Mac).</small>
                <button class="btn-primary" type="submit">Guardar proyecto</button>
                <p id="form-message" role="status"></p>
            </form>
        </section>
        <section><h2>Mis proyectos</h2><div id="project-list" class="project-grid" aria-live="polite"></div></section>
    </main>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
